on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: docker
    container:
      image: alpine:3.20
    steps:
      - id: apk
        run: apk add git mdbook nodejs-lts
      - id: checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - id: build
        run: mdbook build
      - id: upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: book
          path: book
  publish:
    needs: build
    runs-on: docker
    container:
      image: alpine:3.20
    steps:
      - id: apk
        run: apk add git nodejs-lts openssh-client
      - id: checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          repository: dhruvin/talks
          ref: pages
          ssh-key: ${{ secrets.TALKS }}
          ssh-known-hosts: codeberg.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVIC02vnjFyL+I4RHfvIGNtOgJMe769VTF1VR4EB3ZB
          path: talks
          sparse-checkout: !rustblr
      - id: download
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: book
          path: talks/rustblr
      - id: publish
        run: |
          cd talks
          git config user.name "Dhruvin Gandhi"
          git config user.email "contact@dhruvin.dev"
          git add -A
          git commit --allow-empty -m "Publish ${{ github.SHA }}"
          git push
