on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: docker
    container:
      image: alpine:3.20
    steps:
      - id: apk
        run: apk add git mdbook nodejs-lts
      - id: checkout
        uses: https://code.forgejo.org/actions/checkout@v4
      - id: build
        run: |
          cd rustblr
          mdbook build
      - id: upload
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: rustblr
          path: rustblr/book
  publish:
    needs: build
    runs-on: docker
    container:
      image: alpine:3.20
    steps:
      - id: apk
        run: apk add git nodejs-lts
      - id: checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: pages
          sparse-checkout: .
      - id: download
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: rustblr
          path: rustblr
      - id: publish
        run: |
          git config user.name "Dhruvin Gandhi"
          git config user.email "contact@dhruvin.dev"
          git add --sparse -A
          git commit --allow-empty -m "Publish ${{ github.SHA }}"
          git push
